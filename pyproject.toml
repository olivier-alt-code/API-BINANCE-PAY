[project]
name = "mis-notas"
version = "0.1.0"
description = "App personal de notas, proyectos, planes y contraseñas (Flask + SQLite)."
requires-python = ">=3.11"
dependencies = ["flask>=3.0,<4", "cryptography>=42", "waitress>=3.0", "tzdata>=2024.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["notas*"]

[tool.setuptools.package-data]
notas = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S608"]  # SQL is built only from fixed fragments; values are always bound

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
