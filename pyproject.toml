[project]
name = "binance-pay-verifier"
version = "0.1.0"
description = "Verifies Binance payments using authenticated Binance notification emails received in Gmail."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.118,<1.0",
    "uvicorn[standard]>=0.37",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.11,<3",
    "sqlalchemy[asyncio]>=2.0.43,<2.2",
    "alembic>=1.16,<2",
    "psycopg[binary]>=3.2.10,<4",
    "cryptography>=45",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.13",
    "mypy>=1.18",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: tests that require PostgreSQL (TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PL", "N"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",
    "S101",     # assert is fine in tests
    "RUF001", "RUF002", "RUF003",  # spanish/ambiguous unicode in docs strings
    "B008",     # FastAPI Depends() in defaults
]

[tool.ruff.lint.per-file-ignores]
"app/api/routes/payments.py" = ["E501"]  # markdown table in OpenAPI description
"tests/**" = ["S105", "S106", "S311", "PLC0415", "S608"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/", "tests/"]
warn_unused_ignores = true
