name: Deploy to Azure

# Builds the image, pushes it to GitHub Container Registry and points the Azure Web App
# (Web App for Containers) at it using the publish profile.
#
# Repository secrets:
#   AZURE_WEBAPP_NAME             name of the Web App for THIS site (not the API's)
#   AZURE_WEBAPP_PUBLISH_PROFILE  contents of its .PublishSettings file

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Image name (ghcr.io/<owner>/<repo>, lowercase)
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY}"
          echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ env.IMAGE }}:${{ github.sha }}
